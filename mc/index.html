<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣诞礼物祝福</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0a2e1d 0%, #0d3b2a 30%, #165c40 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 15px 40px;
            position: relative;
        }
        
        /* 雪花效果 */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            opacity: 0.7;
            animation: snowfall linear infinite;
        }
        
        @keyframes snowfall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        /* 头部 */
        .header {
            text-align: center;
            padding: 20px 0 10px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            color: #ffdd40;
            position: relative;
            display: inline-block;
        }
        
        .header h1:after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 10%;
            width: 80%;
            height: 3px;
            background: rgba(255, 221, 64, 0.7);
            border-radius: 3px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #c1e8d9;
            margin-bottom: 10px;
        }
        
        /* 祝福语卡片 */
        .blessing-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .blessing-text {
            text-align: center;
            line-height: 1.8;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #f0f7f3;
        }
        
        .highlight {
            color: #ffdd40;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 0 0 5px rgba(255, 221, 64, 0.5);
        }
        
        .author {
            text-align: right;
            font-style: italic;
            color: #a8d5ba;
            font-size: 1rem;
            margin-top: 15px;
            padding-right: 10px;
        }
        
        /* 礼物区域 */
        .gift-section {
            text-align: center;
            margin: 30px 0;
        }
        
        .gift-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #ffdd40;
        }
        
        .gift-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .gift-box:hover {
            transform: scale(1.05);
        }
        
        .gift-box.clicked {
            transform: scale(1.1);
        }
        
        .box-bottom {
            width: 180px;
            height: 120px;
            background: linear-gradient(to right, #d32f2f, #b71c1c);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 8px 20px rgba(183, 28, 28, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .box-bottom:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .box-lid {
            width: 200px;
            height: 50px;
            background: linear-gradient(to right, #f44336, #d32f2f);
            border-radius: 10px 10px 0 0;
            position: absolute;
            top: 0;
            left: -10px;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 5px 15px rgba(183, 28, 28, 0.4);
            z-index: 2;
        }
        
        .box-lid.open {
            transform: translateY(-60px) rotateX(180deg);
        }
        
        .ribbon {
            width: 180px;
            height: 20px;
            background: #4CAF50;
            position: absolute;
            top: 20px;
            left: 0;
            z-index: 1;
        }
        
        .ribbon:before, .ribbon:after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
        
        .ribbon:before {
            border-width: 10px 15px 10px 0;
            border-color: transparent #2E7D32 transparent transparent;
            left: -15px;
            top: 0;
        }
        
        .ribbon:after {
            border-width: 10px 0 10px 15px;
            border-color: transparent transparent transparent #2E7D32;
            right: -15px;
            top: 0;
        }
        
        .ribbon-bow {
            width: 50px;
            height: 40px;
            background: #4CAF50;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }
        
        .ribbon-bow:before, .ribbon-bow:after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: #4CAF50;
            border-radius: 50%;
            top: 10px;
        }
        
        .ribbon-bow:before {
            left: -25px;
        }
        
        .ribbon-bow:after {
            right: -25px;
        }
        
        /* 礼物内容 */
        .gift-content {
            position: absolute;
            width: 100%;
            bottom: 10px;
            left: 0;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease 0.3s;
            z-index: 1;
        }
        
        .gift-content.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .gift-item {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffdd40;
            text-shadow: 0 0 10px rgba(255, 221, 64, 0.7);
        }
        
        .gift-message {
            font-size: 1.2rem;
            color: #e8f5e9;
            font-weight: bold;
        }
        
        /* 分享按钮 */
        .share-section {
            text-align: center;
            margin: 30px 0 20px;
        }
        
        .share-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #a8d5ba;
        }
        
        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .share-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .share-btn:hover {
            transform: translateY(-5px);
        }
        
        .wechat-btn {
            background: linear-gradient(135deg, #09bb07, #09a305);
        }
        
        .friends-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }
        
        .moment-btn {
            background: linear-gradient(135deg, #2196F3, #0d8bf2);
        }
        
        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #a8d5ba;
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .instructions {
            font-size: 0.9rem;
            color: #c1e8d9;
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .blessing-text {
                font-size: 1.1rem;
            }
            
            .highlight {
                font-size: 1.2rem;
            }
            
            .gift-box {
                width: 160px;
                height: 160px;
            }
            
            .box-bottom {
                width: 160px;
                height: 100px;
            }
            
            .box-lid {
                width: 180px;
                height: 45px;
            }
            
            .share-buttons {
                gap: 15px;
            }
            
            .share-btn {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease forwards;
        }
        
        /* 提示框样式 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 雪花效果 -->
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="container">
        <!-- 头部 -->
        <div class="header fade-in-up">
            <h1>🎄 圣诞礼物祝福 🎁</h1>
            <div class="subtitle">将这份特别的祝福，送给特别的你</div>
        </div>
        
        <!-- 祝福语卡片 -->
        <div class="blessing-card fade-in-up">
            <div class="blessing-text">
                <span class="highlight">圣诞快乐🧑‍🎄</span><br>
                愿你与所爱之人平安喜乐🎅<br>
                岁岁年年🎄<br>
                在这温馨的圣诞夜，<br>
                愿爱与温暖常伴左右，<br>
                平安喜乐永驻心间。
            </div>
            <div class="author">—— 圣诞祝福 · 2025</div>
        </div>
        
        <!-- 礼物区域 -->
        <div class="gift-section fade-in-up">
            <div class="gift-title">点击开启圣诞礼物 🎁</div>
            <div class="gift-box" id="giftBox">
                <div class="box-lid" id="boxLid"></div>
                <div class="ribbon"></div>
                <div class="ribbon-bow"></div>
                <div class="box-bottom">
                    <div class="gift-content" id="giftContent">
                        <div class="gift-item">❤️</div>
                        <div class="gift-message">愿你与家人共享温馨时光</div>
                    </div>
                </div>
            </div>
            <div class="instructions">点击礼物盒打开惊喜</div>
        </div>
        
        <!-- 分享区域 -->
        <div class="share-section fade-in-up">
            <div class="share-title">分享这份祝福给亲友</div>
            <div class="share-buttons">
                <div class="share-btn wechat-btn" onclick="shareTo('微信好友')">
                    <i class="fab fa-weixin"></i>
                </div>
                <div class="share-btn friends-btn" onclick="shareTo('微信朋友圈')">
                    <i class="fas fa-users"></i>
                </div>
                <div class="share-btn moment-btn" onclick="shareTo('微信好友或群聊')">
                    <i class="fas fa-share-alt"></i>
                </div>
            </div>
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            <p>🎄 圣诞快乐 · 新年安康 🎄</p>
            <p>祝福永存心间，温暖常伴左右</p>
        </div>
    </div>
    
    <!-- 提示框 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 生成雪花
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeCount = 40;
            const snowflakeIcons = ['❄️', '❅', '❆', '＊', '·'];
            
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.innerHTML = snowflakeIcons[Math.floor(Math.random() * snowflakeIcons.length)];
                
                // 随机大小
                const size = Math.random() * 1.5 + 0.8;
                snowflake.style.fontSize = size + 'em';
                
                // 随机位置
                snowflake.style.left = Math.random() * 100 + 'vw';
                
                // 随机动画时长
                const duration = Math.random() * 10 + 10;
                snowflake.style.animationDuration = duration + 's';
                
                // 随机延迟
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                
                // 随机透明度
                snowflake.style.opacity = Math.random() * 0.7 + 0.3;
                
                snowflakesContainer.appendChild(snowflake);
            }
        }
        
        // 礼物盒点击事件
        document.getElementById('giftBox').addEventListener('click', function() {
            const boxLid = document.getElementById('boxLid');
            const giftContent = document.getElementById('giftContent');
            const giftBox = document.getElementById('giftBox');
            
            // 如果已经打开，则不再执行
            if (boxLid.classList.contains('open')) return;
            
            // 添加打开效果
            boxLid.classList.add('open');
            giftBox.classList.add('clicked');
            
            // 延迟显示礼物内容
            setTimeout(() => {
                giftContent.classList.add('show');
                
                // 显示提示
                showToast('🎁 礼物已打开！愿您圣诞快乐！');
            }, 500);
            
            // 添加打开音效（模拟）
            const audio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ');
            audio.volume = 0.3;
            audio.play().catch(e => console.log("自动播放被阻止，用户需要交互"));
        });
        
        // 分享功能（复制链接）
        function shareTo(platform) {
            const linkToCopy = 'https://yuanmxc.site/mc';
            let message = '';

            // 1. 检查浏览器是否支持 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(linkToCopy)
                    .then(() => {
                        // 复制成功
                        message = `✅ 已将分享链接复制到剪贴板`;
                        showToast(`${message}`);
                    })
                    .catch(err => {
                        // 复制失败
                        console.error('复制失败:', err);
                        message = `❌ 分享链接复制失败`;
                        showToast(`${message}`);
                    });
            } else {
                // 2. 浏览器不支持 Clipboard API 时的回退方案（旧浏览器/特殊环境）
                // 这种方案兼容性较好，但代码稍微复杂，需要创建临时元素。
                const tempInput = document.createElement('textarea');
                tempInput.value = linkToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                
                try {
                    document.execCommand('copy');
                    message = `✅ 已将分享链接复制到剪贴板`;
                    showToast(`${message}`);
                } catch (err) {
                    message = `❌ 分享链接复制失败`;
                    showToast(`${message}`);
                } finally {
                    document.body.removeChild(tempInput);
                }
            }
        }
        
        // 显示提示
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // 初始化雪花
        window.addEventListener('load', function() {
            createSnowflakes();
            
            // 添加页面加载动画
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((el, index) => {
                el.style.animationDelay = (index * 0.2) + 's';
            });
            
            // 显示初始提示
            // setTimeout(() => {
            //     showToast('✨ 欢迎来到圣诞祝福页面');
            // }, 1000);
        });
    </script>
</body>
</html>
